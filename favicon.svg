<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    The mark: three isometric slabs, the AI Fabric stack from the hero.
    Agents on top, the gateway (accent) in the middle, models and tools below.
  -->
  <rect width="64" height="64" rx="14" fill="#0f131c"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#97a8c7" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- bottom slab: models and tools -->
  <path d="M12 41 L32 51 L32 57 L12 47 Z" fill="#252d40"/>
  <path d="M32 51 L52 41 L52 47 L32 57 Z" fill="#2c3548"/>
  <path d="M32 31 L52 41 L32 51 L12 41 Z" fill="#3a4660"/>

  <!-- middle slab: the gateway -->
  <path d="M12 29 L32 39 L32 45 L12 35 Z" fill="#2b62c6"/>
  <path d="M32 39 L52 29 L52 35 L32 45 Z" fill="#3573dc"/>
  <path d="M32 19 L52 29 L32 39 L12 29 Z" fill="#5b9cf6"/>

  <!-- top slab: agents -->
  <path d="M12 17 L32 27 L32 33 L12 23 Z" fill="#b6c0d3"/>
  <path d="M32 27 L52 17 L52 23 L32 33 Z" fill="#cad2e2"/>
  <path d="M32 7 L52 17 L32 27 L12 17 Z" fill="#eef1f7"/>
</svg>
